[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djndonacije"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "arrow==1.4.0",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.120",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "requests==2.34.2",
    "Pillow==13.0.0",
    "braintree==4.48.0",
    "djangorestframework==3.18.3",
    "django-wkhtmltopdf==3.4.0",
    "django-tinymce==5.0.0",
    "django-admin-sortable2==2.3.1",
    "django-admin-inline-paginator-plus==0.1.5",
    "sentry-sdk==2.73.0",
    "zulip==0.9.1",
    "django-cors-headers==4.9.0",
    "django-modeltranslation==0.20.6",
    "django-behaviors==0.5.1",
    "django-import-export==4.4.3",
    "slackclient==2.9.4",
    "qrcodegen==1.8.0",
]

[dependency-groups]
dev = [
    "black==25.1.0",
    "django-stubs==5.2.2",
    "django-stubs-ext==5.2.2",
    "ipython==9.17.1",
    "isort",
]

[tool.setuptools.packages.find]
include = ["djnd_supporters*", "djndonacije*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
